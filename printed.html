<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>United Leather - Labels Printed</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f4f4f2; color: #1b1b1b; margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 440px; }
  .badge { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center;
           justify-content: center; font-size: 64px; color: #fff; background: #9a9a9a; }
  .badge.ok { background: #1e8e3e; } .badge.err { background: #c5221f; }
  h1 { font-size: 26px; margin: 0 0 8px; } p { color: #444; font-size: 16px; }
  button { margin-top: 14px; font-size: 16px; font-weight: 700; padding: 12px 20px; border-radius: 10px; border: 0; background: #1b1b1b; color: #fff; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="badge" id="badge">…</div>
  <h1 id="title">Marking labels printed…</h1>
  <p id="msg">One moment.</p>
  <button id="retry" hidden>Try again</button>
</main>
<script>
(function () {
  // The "Mark all labels printed" automation webhook (wfleqwI7ZXfRr0aBm)
  var WEBHOOK = "https://hooks.airtable.com/workflows/v1/genericWebhook/appdkkKINWDrpiX76/wfleqwI7ZXfRr0aBm/wtr49O5Vof7cAuoCL";
  var badge = document.getElementById("badge"), title = document.getElementById("title"),
      msg = document.getElementById("msg"), retry = document.getElementById("retry");
  function show(state, t, m) { badge.className = "badge " + state; badge.textContent = state === "ok" ? "✓" : state === "err" ? "!" : "…";
    title.textContent = t; msg.textContent = m; retry.hidden = state !== "err"; }
  function send() {
    show("", "Marking labels printed…", "One moment.");
    fetch(WEBHOOK, { method: "POST", mode: "no-cors", cache: "no-store",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "action=markPrinted&at=" + encodeURIComponent(new Date().toISOString()) })
    .then(function () { show("ok", "Done", "Every label that was Not Printed is now Printed with today's date. It will disappear from the Weekly Label Printing page in a few seconds. You can close this tab."); })
    .catch(function () { show("err", "Not sent", "No connection. Check the network and tap Try again."); });
  }
  retry.addEventListener("click", send);
  send();
})();
</script>
</body>
</html>
