<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>United Leather - Factory Labels Printed</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f2; color: #1b1b1b;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  main { width: 100%; max-width: 420px; }
  .badge { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
           font-size: 60px; color: #fff; background: #1a56c4; }
  .badge.ok { background: #1e8e3e; } .badge.err { background: #c5221f; } .badge.sending { background: #9a9a9a; }
  h1 { font-size: 26px; margin: 0 0 8px; } p { font-size: 17px; color: #444; }
  button { margin-top: 14px; font-size: 18px; font-weight: 700; padding: 14px 22px; border-radius: 12px; border: 0; background: #1b1b1b; color: #fff; width: 100%; }
  button.light { background: #fff; color: #1b1b1b; border: 2px solid #ddd; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="badge" id="badge">?</div>
  <h1 id="title">Did the factory labels print OK?</h1>
  <p id="msg">Tapping Yes marks <b>every</b> factory label that is waiting to print as <b>Printed</b> with today's date, so they leave the Weekly Label Printing list. Only tap Yes after every sheet printed OK.</p>
  <button id="yes">Yes – mark factory labels printed</button>
  <button id="no" class="light">No – keep them on the list</button>
</main>
<script>
(function () {
  // "Mark all labels printed" automation webhook (factory labels)
  var WEBHOOK = "https://hooks.airtable.com/workflows/v1/genericWebhook/appdkkKINWDrpiX76/wfleqwI7ZXfRr0aBm/wtr49O5Vof7cAuoCL";
  var b = document.getElementById("badge"), t = document.getElementById("title"), m = document.getElementById("msg"),
      yes = document.getElementById("yes"), no = document.getElementById("no");
  no.onclick = function () { b.className = "badge"; b.textContent = "–"; t.textContent = "Nothing changed"; m.textContent = "The factory labels stay on the print list. You can close this tab."; yes.hidden = no.hidden = true; };
  yes.onclick = function () {
    yes.disabled = true; b.className = "badge sending"; b.textContent = "…"; t.textContent = "Marking printed…"; m.textContent = "";
    fetch(WEBHOOK, { method: "POST", mode: "no-cors", cache: "no-store", keepalive: true,
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "action=markPrinted&at=" + encodeURIComponent(new Date().toISOString()) })
      .then(function () { b.className = "badge ok"; b.textContent = "✓"; t.textContent = "Done"; m.textContent = "The printed factory labels leave the list in a minute or two. You can close this tab."; yes.hidden = no.hidden = true; })
      .catch(function () { b.className = "badge err"; b.textContent = "!"; t.textContent = "Not sent"; m.textContent = "No connection. Check Wi-Fi and tap Yes again."; yes.disabled = false; });
  };
})();
</script>
</body>
</html>
