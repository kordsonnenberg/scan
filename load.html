<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>United Leather - Loading</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root { color-scheme: light; --ok:#1e8e3e; --bad:#c5221f; --warn:#b06000; --ink:#1b1b1b; --muted:#666; --line:#ddd; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f4f4f2; color: var(--ink);
         padding: 12px calc(12px + env(safe-area-inset-right)) 120px calc(12px + env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 0 10px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: .02em; }
  header .lid { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); }
  .cam { position: relative; background: #111; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; text-align: center; padding: 20px; }
  .cam .frame { position: absolute; inset: 18% 22%; border: 3px solid rgba(255,255,255,.8); border-radius: 12px; pointer-events: none; }
  .flash { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; color: #fff; font-weight: 800; font-size: 20px; line-height: 1.25;
           transform: translateY(100%); transition: transform .15s; }
  .flash.show { transform: translateY(0); }
  .flash small { display: block; font-weight: 600; font-size: 15px; opacity: .95; margin-top: 2px; }
  .flash.ok { background: var(--ok); } .flash.bad { background: var(--bad); } .flash.warn { background: var(--warn); } .flash.info { background: #1a56c4; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 18px; background: var(--ink); color: #fff; }
  button.light { background: #fff; color: var(--ink); border: 2px solid var(--line); }
  button.big { width: 100%; font-size: 19px; padding: 16px; }
  button:disabled { opacity: .45; }
  .hint { color: var(--muted); font-size: 15px; margin: 10px 2px; line-height: 1.4; }
  .orders { display: grid; gap: 10px; margin-top: 12px; }
  .order { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .order.done { border-color: var(--ok); }
  .order .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .order .so { font-size: 20px; font-weight: 800; }
  .order .count { font-size: 18px; font-weight: 800; }
  .order.done .count { color: var(--ok); }
  .bar { height: 8px; background: #eee; border-radius: 99px; overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 4px 8px; border-radius: 8px; background: #f1f1ef; color: #555; }
  .chip.in { background: #e3f3e7; color: var(--ok); font-weight: 700; }
  .x { background: none; color: var(--muted); padding: 4px 8px; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #f4f4f2; border-top: 1px solid var(--line);
            padding: 10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }
  .bottom .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .bottom .in button { flex: 1; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .sheet h2 { margin: 0 0 8px; font-size: 22px; }
  .sheet ul { padding-left: 18px; margin: 8px 0 14px; } .sheet li { margin: 4px 0; font-size: 16px; }
  .sheet .warnline { color: var(--warn); font-weight: 700; }
  .sheet .row { display: flex; gap: 8px; } .sheet .row button { flex: 1; }
  .empty { text-align: center; color: var(--muted); padding: 18px 10px; border: 2px dashed var(--line); border-radius: 14px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <header><h1>LOADING</h1><span class="lid" id="lid"></span></header>
  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame" hidden></div>
    <div class="start" id="start">
      <div style="font-size:17px">Tap to turn on the camera, then scan each order's <b>packing list</b>, then every <b>box</b>.</div>
      <button class="light" id="startBtn">Start camera</button>
    </div>
    <div class="flash" id="flash"></div>
  </div>
  <div id="orders" class="orders"></div>
  <p class="hint" id="hint"></p>
</main>

<div class="bottom"><div class="in">
  <button class="light" id="undoBtn">Undo last scan</button>
  <button id="finishBtn">Finish load</button>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
(function () {
  // ---- Settings: Airtable automation webhooks ----
  var PIECE_WEBHOOK = "https://hooks.airtable.com/workflows/v1/genericWebhook/appdkkKINWDrpiX76/wflFvWko8CYkCq3zN/wtrH1SM89ls2mtbG4"; // Loading → piece loaded
  var ORDER_WEBHOOK = "https://hooks.airtable.com/workflows/v1/genericWebhook/appdkkKINWDrpiX76/wflF9VHie1yywLbqp/wtrx7xSqoY0vDox06"; // Loading → order load finished
  var SEND_GAP_MS = 400;          // spacing between posts (Airtable webhooks allow ~5/second)
  var SAME_CODE_IGNORE_MS = 2500; // ignore the same QR seen again within this time

  var KEY = "ulLoad", QKEY = "ulLoadQueue";
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function newLoadId() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return "LOAD-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  var state = load(KEY, null);
  if (!state || !state.orders) state = { loadId: newLoadId(), orders: [], log: [] };

  var $ = function (id) { return document.getElementById(id); };

  // ---------- sounds ----------
  var actx = null;
  function beep(kind) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var tones = kind === "ok" ? [[880, .09]] : kind === "done" ? [[880, .09], [1320, .16]] : kind === "warn" ? [[520, .15]] : [[220, .22], [180, .3]];
      var t = actx.currentTime;
      tones.forEach(function (tn) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = kind === "bad" ? "square" : "sine"; o.frequency.value = tn[0];
        g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + tn[1]);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + tn[1]); t += tn[1] + .03;
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(kind === "bad" ? [250, 80, 250] : 60); } catch (e) {}
  }

  var flashTimer = null;
  function flash(kind, big, small) {
    var f = $("flash");
    f.className = "flash show " + kind;
    f.innerHTML = "";
    f.appendChild(document.createTextNode(big));
    if (small) { var s = document.createElement("small"); s.textContent = small; f.appendChild(s); }
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { f.className = "flash " + kind; }, kind === "bad" ? 3500 : 2200);
  }

  // ---------- data ----------
  function findOrder(so) { for (var i = 0; i < state.orders.length; i++) if (state.orders[i].so === so) return state.orders[i]; return null; }

  function addOrder(so, codesStr) {
    so = (so || "").trim().toUpperCase();
    var codes = (codesStr || "").split(",").map(function (c) { return c.trim().toUpperCase(); }).filter(Boolean);
    if (!so) return flash("bad", "Not a valid packing list", "This QR has no order number.");
    var o = findOrder(so);
    if (o) {
      codes.forEach(function (c) { if (o.codes.indexOf(c) < 0) o.codes.push(c); });
      save(KEY, state); render();
      return flash("info", so + " is already on this load", o.codes.length + " pieces on its list");
    }
    if (!codes.length) {
      return flash("warn", so + ": nothing left to load", "Every piece on this order is already marked Loaded. Reprint the packing list if that is wrong.");
    }
    state.orders.push({ so: so, codes: codes, loaded: [] });
    save(KEY, state); render(); beep("ok");
    flash("info", "Added " + so, codes.length + " piece" + (codes.length === 1 ? "" : "s") + " to load");
  }

  function scanPiece(labelId) {
    labelId = (labelId || "").trim().toUpperCase();
    var dash = labelId.indexOf("-");
    if (dash < 1) { beep("bad"); return flash("bad", "REJECTED", "Not a United Leather piece label."); }
    var so = labelId.slice(0, dash), code = labelId.slice(dash + 1);
    if (!state.orders.length) { beep("bad"); return flash("bad", "Scan a packing list first", "Add the order(s) going on this truck, then scan boxes."); }
    var o = findOrder(so);
    if (!o) { beep("bad"); return flash("bad", "REJECTED – not on this load", labelId + " belongs to " + so + ", which is not on this truck."); }
    if (o.codes.indexOf(code) < 0) { beep("bad"); return flash("bad", "REJECTED – not on " + so + "'s list", labelId + " is not on the printed packing list (already loaded before?)."); }
    if (o.loaded.indexOf(code) >= 0) { beep("warn"); return flash("warn", "Already scanned", labelId); }
    o.loaded.push(code);
    state.log.push({ so: so, code: code, t: Date.now() });
    save(KEY, state); render();
    if (o.loaded.length === o.codes.length) { beep("done"); flash("ok", so + " COMPLETE ✓", "All " + o.codes.length + " pieces loaded"); }
    else { beep("ok"); flash("ok", "✓ " + labelId, so + ": " + o.loaded.length + " of " + o.codes.length + " loaded"); }
  }

  function handleCode(text) {
    var url = null;
    try { url = new URL(text); } catch (e) {}
    if (url) {
      var p = url.searchParams;
      if (p.get("o") !== null && p.get("i") !== null) return addOrder(p.get("o"), p.get("i"));
      var l = p.get("l") || p.get("label");
      if (l) return scanPiece(l);
    } else if (/^SO?\w*-L\d+-P\d+$/i.test(text.trim())) {
      return scanPiece(text);
    }
    beep("bad"); flash("bad", "Unknown code", "That QR is not a United Leather packing list or piece label.");
  }

  // ---------- render ----------
  function render() {
    $("lid").textContent = state.loadId;
    var box = $("orders"); box.innerHTML = "";
    if (!state.orders.length) {
      var e = document.createElement("div"); e.className = "empty";
      e.textContent = "No orders on this load yet. Scan the QR code on each order's printed packing list.";
      box.appendChild(e);
    }
    state.orders.forEach(function (o) {
      var done = o.loaded.length === o.codes.length;
      var d = document.createElement("div"); d.className = "order" + (done ? " done" : "");
      var top = document.createElement("div"); top.className = "top";
      var so = document.createElement("div"); so.className = "so"; so.textContent = o.so;
      var cnt = document.createElement("div"); cnt.className = "count"; cnt.textContent = done ? "COMPLETE ✓" : o.loaded.length + " of " + o.codes.length;
      var x = document.createElement("button"); x.className = "x"; x.textContent = "Remove";
      x.onclick = function () { removeOrder(o.so); };
      top.appendChild(so); top.appendChild(cnt); top.appendChild(x);
      var bar = document.createElement("div"); bar.className = "bar";
      var i = document.createElement("i"); i.style.width = (o.codes.length ? 100 * o.loaded.length / o.codes.length : 0) + "%"; bar.appendChild(i);
      var chips = document.createElement("div"); chips.className = "chips";
      o.codes.forEach(function (c) {
        var ch = document.createElement("span"); ch.className = "chip" + (o.loaded.indexOf(c) >= 0 ? " in" : "");
        ch.textContent = (o.loaded.indexOf(c) >= 0 ? "✓ " : "") + c; chips.appendChild(ch);
      });
      d.appendChild(top); d.appendChild(bar); d.appendChild(chips); box.appendChild(d);
    });
    var q = load(QKEY, []);
    $("hint").textContent = q.length ? "⚠ " + q.length + " update(s) from a previous load were not sent yet — tap Finish load to send them." : "";
    $("finishBtn").disabled = !state.orders.length && !q.length;
    $("undoBtn").disabled = !state.log.length;
  }

  function removeOrder(so) {
    var o = findOrder(so);
    sheet("<h2>Remove " + esc(so) + " from this load?</h2><p>" + (o && o.loaded.length ? "<span class='warnline'>" + o.loaded.length + " scanned piece(s) of this order will be forgotten.</span>" : "Nothing has been scanned for it yet.") +
      "</p><div class='row'><button class='light' data-a='close'>Keep it</button><button data-a='rm'>Remove</button></div>", {
      rm: function () { state.orders = state.orders.filter(function (x) { return x.so !== so; }); state.log = state.log.filter(function (l) { return l.so !== so; }); save(KEY, state); render(); closeSheet(); }
    });
  }

  $("undoBtn").onclick = function () {
    var last = state.log.pop(); if (!last) return;
    var o = findOrder(last.so);
    if (o) o.loaded = o.loaded.filter(function (c) { return c !== last.code; });
    save(KEY, state); render(); flash("warn", "Undone", last.so + "-" + last.code + " is no longer counted as loaded");
  };

  // ---------- finish / send ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var sheetActions = {};
  function sheet(html, actions) { $("sheet").innerHTML = html; sheetActions = actions || {}; $("modal").classList.add("show"); }
  function closeSheet() { $("modal").classList.remove("show"); }
  $("sheet").addEventListener("click", function (e) {
    var a = e.target.getAttribute && e.target.getAttribute("data-a"); if (!a) return;
    if (a === "close") return closeSheet();
    if (sheetActions[a]) sheetActions[a]();
  });

  $("finishBtn").onclick = function () {
    var q = load(QKEY, []);
    if (!state.orders.length && q.length) return sendQueue();
    var lines = state.orders.map(function (o) {
      var left = o.codes.length - o.loaded.length;
      return "<li><b>" + esc(o.so) + "</b>: " + o.loaded.length + " of " + o.codes.length + " loaded" + (left ? " — <span class='warnline'>" + left + " still to fulfill</span>" : " ✓") + "</li>";
    }).join("");
    var none = state.orders.filter(function (o) { return !o.loaded.length; }).length;
    sheet("<h2>Finish this load?</h2><ul>" + lines + "</ul>" +
      (none ? "<p class='warnline'>" + none + " order(s) have nothing scanned — they will be marked as loaded with every piece still to fulfill.</p>" : "") +
      "<p>Airtable will mark the scanned pieces <b>Loaded</b>. Anything not scanned stays <b>Still to Fulfill</b>.</p>" +
      "<div class='row'><button class='light' data-a='close'>Keep scanning</button><button data-a='go'>Send to Airtable</button></div>", { go: queueAndSend });
  };

  function queueAndSend() {
    var q = load(QKEY, []), lid = state.loadId;
    state.orders.forEach(function (o) {
      o.loaded.forEach(function (c) { q.push({ u: PIECE_WEBHOOK, b: "label=" + encodeURIComponent(o.so + "-" + c) + "&load=" + encodeURIComponent(lid) }); });
    });
    state.orders.forEach(function (o) { q.push({ u: ORDER_WEBHOOK, b: "so=" + encodeURIComponent(o.so) + "&load=" + encodeURIComponent(lid) }); });
    save(QKEY, q);
    state = { loadId: newLoadId(), orders: [], log: [] }; save(KEY, state);
    sendQueue();
  }

  function sendQueue() {
    var q = load(QKEY, []), total = q.length, sent = 0;
    if (!total) { closeSheet(); render(); return; }
    function step() {
      q = load(QKEY, []);
      if (!q.length) {
        sheet("<h2>✓ Load sent</h2><p>" + total + " update(s) sent to Airtable. Pieces show <b>Loaded</b> in a few seconds.</p><div class='row'><button data-a='close'>Start next load</button></div>", {});
        render(); return;
      }
      sheet("<h2>Sending…</h2><p>" + sent + " of " + total + " sent. Keep this page open.</p>", {});
      var item = q[0];
      fetch(item.u, { method: "POST", mode: "no-cors", cache: "no-store", keepalive: true,
        headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: item.b })
        .then(function () { q.shift(); save(QKEY, q); sent++; setTimeout(step, SEND_GAP_MS); })
        .catch(function () {
          sheet("<h2>No connection</h2><p>" + sent + " of " + total + " sent. The rest are saved on this phone — nothing is lost.</p><div class='row'><button data-a='retry'>Try again</button></div>", { retry: sendQueue });
          render();
        });
    }
    step();
  }

  // ---------- camera ----------
  var video = $("video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
  var detector = null, lastText = "", lastAt = 0, busy = false;
  if ("BarcodeDetector" in window) { try { detector = new window.BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; } }

  function seen(text) {
    var now = Date.now();
    if (text === lastText && now - lastAt < SAME_CODE_IGNORE_MS) return;
    lastText = text; lastAt = now; handleCode(text);
  }

  function tick() {
    if (video.readyState >= 2 && !busy) {
      if (detector) {
        busy = true;
        detector.detect(video).then(function (r) { if (r && r.length) seen(r[0].rawValue); }).catch(function () {}).then(function () { busy = false; });
      } else if (window.jsQR) {
        var w = video.videoWidth, h = video.videoHeight, s = Math.min(1, 640 / Math.max(w, h));
        canvas.width = Math.round(w * s); canvas.height = Math.round(h * s);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
        if (code && code.data) seen(code.data);
      }
    }
    setTimeout(tick, 120);
  }

  $("startBtn").onclick = function () {
    beep("ok"); // unlocks sound on iPhone
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (stream) {
        video.srcObject = stream; video.play();
        $("start").hidden = true; $("frame").hidden = false; tick();
      })
      .catch(function () {
        $("start").innerHTML = "<div style='font-size:17px'>Camera blocked. Allow camera access for this page in the browser settings, then reload.</div>";
      });
  };

  // ---------- opened from a packing-list QR with the phone camera ----------
  var qs = new URLSearchParams(location.search);
  if (qs.get("o") !== null && qs.get("i") !== null) {
    addOrder(qs.get("o"), qs.get("i"));
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
