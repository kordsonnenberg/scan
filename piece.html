<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>United Leather - Piece</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         background: #f4f4f2; color: #1b1b1b; padding: 28px 16px; box-sizing: border-box; }
  main { max-width: 440px; margin: 0 auto; }
  .kicker { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #666; margin-bottom: 6px; }
  h1 { font-size: 30px; margin: 0 0 4px; font-weight: 800; }
  .piece { font-size: 22px; font-weight: 800; color: #1a56c4; margin-bottom: 18px; }
  dl { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 6px 16px; margin: 0; }
  .row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: 0; }
  dt { width: 92px; flex: none; color: #666; font-size: 15px; }
  dd { margin: 0; font-size: 18px; font-weight: 600; word-break: break-word; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { color: #777; font-size: 14px; margin-top: 16px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <div class="kicker">United Leather · Packed piece</div>
  <h1 id="so">—</h1>
  <div class="piece" id="n"></div>
  <dl id="list"></dl>
  <p class="note">Information only — opening this page does not change anything in Airtable. Loaders: scan this label on the <b>Loading</b> page, not with the camera app.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get("l") || "").trim();
  var so = q.get("so") || (id.split("-")[0] || "");
  var m = id.match(/-L(\d+)-P(\d+)$/i);
  document.getElementById("so").textContent = so || "Unknown piece";
  document.getElementById("n").textContent = q.get("n") ? "Piece " + q.get("n") : (m ? "Line " + m[1] + ", piece " + m[2] : "");
  var rows = [["Customer", q.get("c")], ["PO", q.get("po")], ["Product", q.get("p")], ["Label ID", id]];
  var dl = document.getElementById("list");
  rows.forEach(function (r) {
    if (!r[1]) return;
    var d = document.createElement("div"); d.className = "row";
    var t = document.createElement("dt"); t.textContent = r[0];
    var v = document.createElement("dd"); v.textContent = r[1]; if (r[0] === "Label ID") v.className = "id";
    d.appendChild(t); d.appendChild(v); dl.appendChild(d);
  });
})();
</script>
</body>
</html>
